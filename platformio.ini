; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
; Route Arduino `Serial` to the native USB-Serial/JTAG port so diagnostics are
; visible over /dev/ttyACM0.  Without this the C3 sends `Serial` to UART0
; (header pins 20/21), which is why the boot log showed only ROM bootloader
; output and never the app's own prints.
;
; Safe to leave enabled: HWCDC::write() drops output immediately when no host
; is attached (see cdc0_write_char in HWCDC.cpp), so it cannot stall the BLE
; loop while the board runs standalone.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps = 
    ;nkolban/ESP32 BLE Arduino@^1.0.1
	h2zero/NimBLE-Arduino@^2.5.1
monitor_speed = 115200
